[package]
name = "xiangqi-match"
version = "0.1.0"
description = "MagicBlock Ephemeral Rollup match state for 3D Xiangqi"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "xiangqi_match"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
ephemeral-rollups-sdk = { version = "0.16.2", features = ["anchor-compat"] }
